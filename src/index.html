<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="styles.css" />
    <title>VidPlayer</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <main id="load-screen" class="load-screen">
      <section class="load-card" aria-label="Open video">
        <input
          id="video-path"
          type="text"
          placeholder="Enter a video file path"
          spellcheck="false"
          autocomplete="off"
          aria-label="Video file path"
          aria-describedby="load-warning"
          disabled
          autofocus
        />
        <p id="load-warning" role="alert" aria-live="polite"></p>
      </section>
    </main>
    <main id="editor-screen" class="player-overlay" hidden>
      <div id="video-navigation" class="video-navigation" aria-label="Video view: scroll or pinch to zoom, drag to pan, double-click to reset" title="Scroll or pinch to zoom · Drag to pan · Double-click to reset"></div>
      <div id="crop-shade" class="crop-shade" hidden aria-hidden="true"><div></div><div></div><div></div><div></div></div>
      <div id="crop-dimensions" class="crop-dimensions" hidden aria-label="Crop dimensions in source pixels">
        <svg aria-hidden="true">
          <defs><marker id="dimension-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" /></marker></defs>
          <path id="dimension-extensions" class="dimension-extension" />
          <path id="dimension-horizontal" class="dimension-line" />
          <path id="dimension-vertical" class="dimension-line" />
          <text id="dimension-width" dominant-baseline="central"></text>
          <text id="dimension-height" dominant-baseline="central"></text>
        </svg>
      </div>
      <div id="crop-corners" class="crop-corners" hidden role="group" aria-label="Crop video">
        <svg class="crop-corner crop-corner-top-left" viewBox="0 0 24 24"><path d="M22 2H10a8 8 0 0 0-8 8v12" /></svg>
        <svg class="crop-corner crop-corner-bottom-right" viewBox="0 0 24 24"><path d="M2 22h12a8 8 0 0 0 8-8V2" /></svg>
        <span class="crop-crosshair" aria-hidden="true"></span>
        <button class="crop-handle" data-corner="tl" aria-label="Crop top left" title="Drag to crop. Right-click to enter coordinates."></button>
        <button class="crop-handle" data-corner="tr" aria-label="Crop top right" title="Drag to crop"></button>
        <button class="crop-handle" data-corner="bl" aria-label="Crop bottom left" title="Drag to crop"></button>
        <button class="crop-handle" data-corner="br" aria-label="Crop bottom right" title="Drag to crop. Right-click to enter coordinates."></button>
      </div>
      <section class="control-panel" aria-label="Playback controls">
        <div class="timeline-info">
          <p id="status" role="status"></p>
          <div class="frame-time" aria-label="Frame navigation and playback time">
            <button id="previous-frame" class="transport-button frame-button" type="button" disabled aria-label="Previous frame" title="Previous frame (,)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6" /></svg>
            </button>
            <output id="time-readout" class="time-readout" for="progress" role="button" tabindex="0" title="Click or right-click to enter a playhead time">00:00:00 / 00:00:00</output>
            <button id="next-frame" class="transport-button frame-button" type="button" disabled aria-label="Next frame" title="Next frame (.)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg>
            </button>
          </div>
          <button id="fullscreen" class="transport-button frame-button fullscreen-button" type="button" aria-label="Fullscreen view" title="Fullscreen view (F). Double-click video to return.">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5" /></svg>
          </button>
        </div>
        <div class="timeline" aria-label="Trim timeline">
          <input id="progress" class="progress" type="range" min="0" max="1000" step="any" value="0" disabled aria-label="Playback position" />
          <div id="in-point" class="trim-handle trim-handle-in" role="slider" tabindex="0" aria-label="In point"></div>
          <div id="out-point" class="trim-handle trim-handle-out" role="slider" tabindex="0" aria-label="Out point"></div>
        </div>
        <div class="trim-export-row">
          <div class="trim-readout" aria-label="Trim selection">
            <button id="preview-in" class="trim-time" type="button" disabled title="Left-click to preview. Right-click to edit.">In <span id="in-time">00:00:00</span></button>
            <button id="preview-out" class="trim-time" type="button" disabled title="Left-click to preview. Right-click to edit.">Out <span id="out-time">00:00:00</span></button>
          </div>
          <div class="transport-row" aria-label="Playback controls">
            <button id="skip-start" class="transport-button" type="button" disabled aria-label="Go to beginning" title="Go to beginning">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v14M11 6l-6 6 6 6M19 6l-6 6 6 6" /></svg>
            </button>
            <button id="skip-back" class="transport-button skip-button" type="button" disabled aria-label="Skip backward 5 seconds" title="Skip backward (Left arrow). Right-click to change the interval.">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13a8 8 0 1 1 3.2 6.4" /><path d="m1.5 13 2.5 4 2.5-4" /></svg><span id="skip-back-seconds" class="skip-seconds">5</span>
            </button>
            <button id="play-toggle" class="transport-button play-toggle" type="button" disabled aria-label="Play" title="Play (Space)">
              <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 9 6-9 6Z" /></svg>
              <svg class="pause-icon is-hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7v10M15 7v10" /></svg>
            </button>
            <button id="skip-forward" class="transport-button skip-button" type="button" disabled aria-label="Skip forward 5 seconds" title="Skip forward (Right arrow). Right-click to change the interval.">
              <span id="skip-forward-seconds" class="skip-seconds">5</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13a8 8 0 1 0-3.2 6.4" /><path d="m17.5 13 2.5 4 2.5-4" /></svg>
            </button>
            <button id="skip-end" class="transport-button" type="button" disabled aria-label="Go to end" title="Go to end">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5v14M13 6l6 6-6 6M5 6l6 6-6 6" /></svg>
            </button>
          </div>
          <div class="edit-actions">
            <button id="export-clip" class="export-button" type="button" disabled title="Export lossless. Right-click for export modes.">Export</button>
            <button id="edit-toggle" type="button" aria-pressed="false">Edit</button>
          </div>
        </div>
        <p id="export-result" role="status"></p>
        <progress id="export-progress" max="1" value="0" hidden></progress>
      </section>
    </main>
    <dialog id="skip-dialog" class="context-popover skip-dialog">
      <form id="skip-form" method="dialog">
        <input id="skip-amount" type="number" min="1" max="3600" step="any" inputmode="numeric" aria-label="Skip seconds" required />
      </form>
    </dialog>
    <dialog id="trim-time-dialog" class="context-popover trim-time-dialog">
      <form id="trim-time-form" method="dialog">
        <input id="trim-time-input" type="text" inputmode="numeric" aria-label="Trim timecode" spellcheck="false" required />
      </form>
    </dialog>
    <dialog id="crop-coordinate-dialog" class="context-popover crop-coordinate-dialog" aria-labelledby="crop-coordinate-title">
      <form id="crop-coordinate-form">
        <p id="crop-coordinate-title">Crop coordinates</p>
        <div class="crop-coordinate-fields">
          <label>X <input id="crop-coordinate-x" type="number" step="1" inputmode="numeric" required /></label>
          <label>Y <input id="crop-coordinate-y" type="number" step="1" inputmode="numeric" required /></label>
        </div>
        <p class="crop-coordinate-hint">Pixels from the video's top-left edge.</p>
        <div class="crop-coordinate-actions">
          <button id="crop-coordinate-cancel" type="button">Cancel</button>
          <button type="submit">Apply</button>
        </div>
      </form>
    </dialog>
    <dialog id="export-menu" class="context-popover export-menu" aria-label="Export mode">
      <button type="button" data-export-mode="lossless">Lossless</button>
      <button type="button" data-export-mode="precise">Precise</button>
    </dialog>
  </body>
</html>
